name: PadBridge
options:
  bundleIdPrefix: dev.void2610.padbridge
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  PadBridgeKit:
    path: Packages/PadBridgeKit
targets:
  PadBridge:
    type: application
    platform: iOS
    sources:
      - path: Apps/Pad
        excludes:
          - Info.plist
    dependencies:
      - package: PadBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.void2610.padbridge.pad
        INFOPLIST_FILE: Apps/Pad/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  PadBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/PadUITests
    dependencies:
      - target: PadBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.void2610.padbridge.pad.uitests
        TEST_TARGET_NAME: PadBridge
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase の初期化子は MainActor ではないので、既定の分離を MainActor にすると継承できない
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"
  PadBridgeHost:
    type: application
    platform: macOS
    sources:
      - path: Apps/Host
        excludes:
          - Info.plist
    dependencies:
      - package: PadBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.void2610.padbridge.host
        PRODUCT_NAME: PadBridge Host
        INFOPLIST_FILE: Apps/Host/Info.plist
        # CGEvent で他アプリへ入力を送るには App Sandbox の外で動かす必要がある
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  PadBridge:
    build:
      targets:
        PadBridge: all
    test:
      targets:
        - PadBridgeUITests
  PadBridgeHost:
    build:
      targets:
        PadBridgeHost: all
