name: PadBridge
options:
  bundleIdPrefix: dev.void2610.padbridge
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
packages:
  PadBridgeKit:
    path: Packages/PadBridgeKit
targets:
  PadBridge:
    type: application
    platform: iOS
    sources:
      - path: Apps/Pad
        excludes:
          - Info.plist
    dependencies:
      - package: PadBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.void2610.padbridge.pad
        INFOPLIST_FILE: Apps/Pad/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PadBridgeHost:
    type: application
    platform: macOS
    sources:
      - path: Apps/Host
        excludes:
          - Info.plist
          - Host.entitlements
    dependencies:
      - package: PadBridgeKit
      # 補助アプリは Host のバンドルの中に入れ、Mac に別のものをインストールしない
      - target: PadBridgeMic
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.void2610.padbridge.host
        PRODUCT_NAME: PadBridge Host
        INFOPLIST_FILE: Apps/Host/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 補助アプリのマイクの許可は Host の名前で求められ、そのとき Host にもこの権利が要る (hardened runtime)
        CODE_SIGN_ENTITLEMENTS: Apps/Host/Host.entitlements
        # CGEvent で他アプリへ入力を送るには App Sandbox の外で動かす必要がある
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  PadBridgeMic:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mic
        excludes:
          - Info.plist
          - Mic.entitlements
    dependencies:
      - package: PadBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.void2610.padbridge.mic
        PRODUCT_NAME: PadBridge Mic
        INFOPLIST_FILE: Apps/Mic/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Mic/Mic.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  PadBridge:
    build:
      targets:
        PadBridge: all
  PadBridgeHost:
    build:
      targets:
        PadBridgeHost: all
